<!doctype html>
<!-- Car meshes and official UV templates are fetched at setup. They are not part of this repository. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tesla Wrap Studio · 科技P房工作间 3D 贴膜预览</title>
    <style>
      :root {
        --bg: #07090d;
        --panel: rgba(11, 14, 21, 0.88);
        --card: rgba(20, 25, 36, 0.74);
        --text: #eef2f8;
        --muted: #8b98ae;
        --accent: #38bdf8;
        --line: rgba(148, 163, 184, 0.14);
        --line-hover: rgba(56, 189, 248, 0.45);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 "Inter", "SF Pro Text", "PingFang SC", -apple-system, sans-serif;
        overflow: hidden;
      }
      #app {
        display: grid;
        grid-template-columns: 310px 1fr;
        height: 100%;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--line);
        padding: 16px 15px 24px;
        overflow-y: auto;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 10;
      }
      aside::-webkit-scrollbar { width: 5px; }
      aside::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.22); border-radius: 99px; }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 4px;
      }
      .badge {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.1em;
        color: var(--accent);
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.28);
        padding: 2px 7px;
        border-radius: 99px;
      }
      h1 { font-size: 16px; font-weight: 650; margin: 0; letter-spacing: 0.01em; }
      .sub { color: var(--muted); margin-bottom: 12px; font-size: 11.5px; }

      .section {
        border-top: 1px solid var(--line);
        padding-top: 11px;
        margin-top: 11px;
      }
      label {
        display: block;
        color: var(--muted);
        font-size: 10.5px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        margin: 9px 0 5px;
      }
      .section > label:first-child { margin-top: 0; }

      select, button {
        width: 100%;
        appearance: none;
        border: 1px solid var(--line);
        background: var(--card);
        color: var(--text);
        border-radius: 9px;
        padding: 8px 10px;
        font-size: 12px;
        transition: border-color 0.16s, background 0.16s, transform 0.12s;
      }
      select:hover, button:hover { border-color: var(--line-hover); }
      select:focus { outline: none; border-color: var(--accent); }

      button { cursor: pointer; font-weight: 500; }
      button:active { transform: scale(0.985); }
      button.pill { padding: 6.5px 5px; font-size: 11.5px; text-align: center; }
      button.pill.active {
        background: rgba(56, 189, 248, 0.16);
        border-color: var(--accent);
        color: #f0f9ff;
        font-weight: 600;
      }

      .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
      .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }

      .upload-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        border: 1px dashed rgba(148, 163, 184, 0.32);
        border-radius: 9px;
        padding: 8px 10px;
        color: #cbd5e1;
        font-size: 12px;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.45);
        transition: border-color 0.16s, background 0.16s;
      }
      .upload-btn:hover {
        border-color: var(--accent);
        background: rgba(56, 189, 248, 0.08);
      }
      #wrapFile { display: none; }

      .row {
        display: grid;
        grid-template-columns: 1fr 38px;
        gap: 8px;
        align-items: center;
      }
      input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
      .val { color: var(--muted); font-size: 11.5px; font-variant-numeric: tabular-nums; text-align: right; }

      .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
      .swatch {
        height: 24px;
        border-radius: 7px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        cursor: pointer;
        transition: transform 0.14s, border-color 0.14s;
      }
      .swatch:hover { transform: scale(1.08); border-color: #fff; }
      .swatch.active { border: 2px solid var(--accent); }

      #view { position: relative; min-height: 100%; background: #07090d; }
      canvas { display: block; width: 100%; height: 100%; }

      #hud-top {
        position: absolute;
        top: 14px;
        right: 16px;
        display: flex;
        gap: 8px;
        z-index: 5;
      }
      .hud-chip {
        width: auto;
        padding: 7px 12px;
        font-size: 12px;
        border-radius: 99px;
        background: rgba(10, 14, 21, 0.76);
        border: 1px solid var(--line);
        backdrop-filter: blur(12px);
        color: #dce6f5;
      }
      .hud-chip.active {
        border-color: var(--accent);
        background: rgba(14, 165, 233, 0.22);
        color: #fff;
      }

      #hud {
        position: absolute;
        left: 16px;
        bottom: 14px;
        padding: 8px 12px;
        background: rgba(9, 12, 18, 0.74);
        border: 1px solid var(--line);
        border-radius: 10px;
        backdrop-filter: blur(12px);
        color: var(--muted);
        font-size: 11.5px;
        pointer-events: none;
      }
      #status {
        margin-top: 11px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 11.5px;
        white-space: pre-wrap;
        word-break: break-all;
      }

      @media (max-width: 860px) {
        html, body { overflow: auto; }
        #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; }
        #view { order: -1; min-height: 58vh; }
        aside { border-right: none; border-top: 1px solid var(--line); overflow: visible; }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <aside>
        <div class="brand">
          <h1 id="title">焕新 Model Y · P房工作间</h1>
          <span class="badge">PIT BAY 01</span>
        </div>
        <div class="sub" id="subtitle">全3D锻造20"扁胎 · 3D性能卡钳 · 科技P房</div>

        <label>车型</label>
        <select id="carSelect"><option value="yp">焕新 Model Y (Juniper)</option></select>

        <div class="section">
          <label>贴膜涂装（Wrap UV1）</label>
          <select id="wrapSelect"><option>银箭流动线 · 2026 车队风格</option></select>
          <div style="height:7px"></div>
          <label class="upload-btn" for="wrapFile">＋ 上传自定义贴膜 PNG（1024×1024）</label>
          <input id="wrapFile" type="file" accept="image/png,image/*" />
        </div>

        <div class="section">
          <label>P房灯光氛围</label>
          <div class="grid-3" id="lightBtns">
            <button type="button" class="pill active" data-light="studio">科技冷白</button>
            <button type="button" class="pill" data-light="cyber">暗夜轮廓</button>
            <button type="button" class="pill" data-light="inspect">展厅验膜</button>
          </div>

          <label>机位视角</label>
          <div class="grid-3" id="camBtns">
            <button type="button" class="pill active" data-cam="threeQuarter">前 3/4</button>
            <button type="button" class="pill" data-cam="front">正前脸</button>
            <button type="button" class="pill" data-cam="side">正侧面</button>
            <button type="button" class="pill" data-cam="rear">车尾</button>
            <button type="button" class="pill" data-cam="wheel">轮毂特写</button>
            <button type="button" class="pill" data-cam="workshop">工作间全景</button>
          </div>

          <label>20" 3D锻造轮毂配色</label>
          <div class="grid-4" id="rimBtns">
            <button type="button" class="pill active" data-rim="black">熏黑</button>
            <button type="button" class="pill" data-rim="gunmetal">枪灰</button>
            <button type="button" class="pill" data-rim="red">竞速红</button>
            <button type="button" class="pill" data-rim="silver">拉丝银</button>
          </div>

          <label>3D 实体卡钳配色</label>
          <div class="grid-3" id="caliperBtns">
            <button type="button" class="pill active" data-caliper="#d41920">Brembo红</button>
            <button type="button" class="pill" data-caliper="#2c333f">暗夜钛</button>
            <button type="button" class="pill" data-caliper="#eab308">竞速黄</button>
          </div>
        </div>

        <div class="section">
          <label>膜面质感预设</label>
          <div class="grid-3" id="finishBtns">
            <button type="button" class="pill active" data-finish="gloss">高亮清漆</button>
            <button type="button" class="pill" data-finish="satin">缎面哑光</button>
            <button type="button" class="pill" data-finish="metallic">金属液态</button>
          </div>

          <label>清漆 Clearcoat</label>
          <div class="row"><input id="clearcoat" type="range" min="0" max="1" step="0.01" value="0.92" /><span class="val" id="clearcoatVal">0.92</span></div>

          <label>清漆粗糙度</label>
          <div class="row"><input id="clearcoatRoughness" type="range" min="0.01" max="0.45" step="0.01" value="0.05" /><span class="val" id="clearcoatRoughnessVal">0.05</span></div>

          <label>金属度</label>
          <div class="row"><input id="metalness" type="range" min="0" max="1" step="0.01" value="0.22" /><span class="val" id="metalnessVal">0.22</span></div>

          <label>底漆粗糙度</label>
          <div class="row"><input id="roughness" type="range" min="0.05" max="0.95" step="0.01" value="0.24" /><span class="val" id="roughnessVal">0.24</span></div>

          <label>环境反射强度</label>
          <div class="row"><input id="envIntensity" type="range" min="0.2" max="2.5" step="0.05" value="1.35" /><span class="val" id="envIntensityVal">1.35</span></div>

          <label>曝光 Exposure</label>
          <div class="row"><input id="exposure" type="range" min="0.5" max="2.0" step="0.05" value="1.08" /><span class="val" id="exposureVal">1.08</span></div>

          <label>底漆色（透明区域露底）</label>
          <div class="swatches" id="swatches"></div>
        </div>

        <div id="status">正在初始化科技P房工作间…</div>
      </aside>
      <div id="view">
        <div id="hud-top">
          <button type="button" id="spinBtn" class="hud-chip">360° 缓转：关</button>
          <button type="button" id="reloadBtn" class="hud-chip">重载贴图</button>
        </div>
        <div id="hud">左键旋转 · 滚轮缩放 · 右键平移 · 支持拖拽 PNG 贴膜至画布</div>
      </div>
    </div>

/**
 * Custom Procedural Studio Pit-Garage PMREM Environment
 */
function applyPitLighting(mode) {
  const cfg = LIGHT_PRESETS[mode] || LIGHT_PRESETS.studio
  params.lightMode = mode
  scene.background.set(cfg.bg)
  scene.fog.color.set(cfg.fog)

  hemiLight.color.setHex(cfg.hemiSky)
  hemiLight.groundColor.setHex(cfg.hemiGround)
  hemiLight.intensity = cfg.hemiIntensity
  keyLight.color.setHex(cfg.keyColor)
  keyLight.intensity = cfg.keyIntensity
  rimLight.color.setHex(cfg.backRimColor)
  rimLight.intensity = cfg.backRimIntensity

  for (const m of pitLightMaterials.ceiling) {
    m.color.set(cfg.ceilingColor)
    m.emissive.set(cfg.ceilingColor)
    m.emissiveIntensity = cfg.ceilingEmissive * 0.65
  }
  for (const m of pitLightMaterials.accent) {
    m.color.set(cfg.accentColor)
    m.emissive.set(cfg.accentColor)
    m.emissiveIntensity = cfg.accentEmissive
  }

  const envScene = new THREE.Scene()
  envScene.background = new THREE.Color('#04060a')

  const makePanel = (w, h, color, intensity, pos, rot) => {
    const mat = new THREE.MeshBasicMaterial({
      color: new THREE.Color(color).multiplyScalar(intensity),
      side: THREE.DoubleSide,
    })
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat)
    mesh.position.set(...pos)
    mesh.rotation.set(...rot)
    envScene.add(mesh)
  }

  // Overhead parallel studio light ribbons + transverse frame
  makePanel(1.05, 11.5, cfg.ceilingColor, cfg.ceilingEmissive, [0, 4.8, 0], [Math.PI / 2, 0, 0])
  makePanel(0.55, 11.0, cfg.ceilingColor, cfg.ceilingEmissive * 0.88, [-2.55, 4.65, 0], [Math.PI / 2, 0.22, 0])
  makePanel(0.55, 11.0, cfg.ceilingColor, cfg.ceilingEmissive * 0.88, [2.55, 4.65, 0], [Math.PI / 2, -0.22, 0])
  makePanel(7.4, 0.42, cfg.ceilingColor, cfg.ceilingEmissive * 0.72, [0, 4.7, -4.6], [Math.PI / 2, 0, 0])
  makePanel(7.4, 0.42, cfg.ceilingColor, cfg.ceilingEmissive * 0.72, [0, 4.7, 4.6], [Math.PI / 2, 0, 0])

  // Side horizon rim strips
  makePanel(11.0, 0.55, cfg.rimColor, cfg.rimEmissive, [-6.6, 1.35, 0], [0, Math.PI / 2, 0])
  makePanel(11.0, 0.55, cfg.rimColor, cfg.rimEmissive * 0.85, [6.6, 1.35, 0], [0, -Math.PI / 2, 0])

  // Corner vertical accent blades
  makePanel(0.28, 3.6, cfg.accentColor, cfg.accentEmissive * 0.9, [-6.4, 2.0, -5.8], [0, Math.PI / 4, 0])
  makePanel(0.28, 3.6, cfg.accentColor, cfg.accentEmissive * 0.9, [6.4, 2.0, 5.8], [0, -Math.PI * 0.75, 0])

  // Front & rear soft bounce cards
  makePanel(8.5, 2.4, cfg.ceilingColor, cfg.ceilingEmissive * 0.26, [0, 2.0, -7.2], [0, 0, 0])
  makePanel(8.5, 2.4, cfg.ceilingColor, cfg.ceilingEmissive * 0.22, [0, 2.0, 7.2], [0, Math.PI, 0])

  const nextRT = pmrem.fromScene(envScene, 0.018)
  if (currentEnvRT) currentEnvRT.dispose()
  currentEnvRT = nextRT
  scene.environment = nextRT.texture
  scene.environmentIntensity = cfg.envIntensity

  params.exposure = cfg.exposure
  renderer.toneMappingExposure = cfg.exposure
  const expEl = document.getElementById('exposure')
  const expVal = document.getElementById('exposureVal')
  if (expEl) expEl.value = cfg.exposure
  if (expVal) expVal.textContent = cfg.exposure.toFixed(2)
}

/**
 * Procedural 1024x1024 Pit-Box Micro-Cement Floor Texture
 */
function createPitFloorTextures() {
  const size = 1024
  const albedoCanvas = document.createElement('canvas')
  albedoCanvas.width = albedoCanvas.height = size
  const actx = albedoCanvas.getContext('2d')

  const grad = actx.createRadialGradient(size / 2, size / 2, 40, size / 2, size / 2, size * 0.56)
  grad.addColorStop(0, '#232933')
  grad.addColorStop(0.55, '#171c24')
  grad.addColorStop(1, '#0d1016')
  actx.fillStyle = grad
  actx.fillRect(0, 0, size, size)

  // Micro-cement speckle
  for (let i = 0; i < 18000; i++) {
    const x = Math.random() * size
    const y = Math.random() * size
    const v = 18 + Math.floor(Math.random() * 24)
    actx.fillStyle = `rgba(${v},${v + 3},${v + 8},0.22)`
    actx.fillRect(x, y, 2, 2)
  }

  // Expansion joint tile grid
  actx.strokeStyle = 'rgba(6, 8, 12, 0.72)'
  actx.lineWidth = 2
  const step = size / 8
  for (let i = 1; i < 8; i++) {
    const p = i * step
    actx.beginPath(); actx.moveTo(p, 0); actx.lineTo(p, size); actx.stroke()
    actx.beginPath(); actx.moveTo(0, p); actx.lineTo(size, p); actx.stroke()
  }

  // Precision Pit-Box Bay Markings
  const bx = size * 0.31
  const by = size * 0.25
  const bw = size * 0.38
  const bh = size * 0.50
  actx.strokeStyle = 'rgba(205, 222, 245, 0.25)'
  actx.lineWidth = 2.5
  actx.strokeRect(bx, by, bw, bh)

  // Outer dashed safety zone line
  actx.save()
  actx.setLineDash([14, 10])
  actx.strokeStyle = 'rgba(56, 189, 248, 0.28)'
  actx.lineWidth = 2
  actx.strokeRect(bx - 22, by - 22, bw + 44, bh + 44)
  actx.restore()

  // Corner L-brackets
  const arm = 36
  actx.strokeStyle = 'rgba(235, 244, 255, 0.78)'
  actx.lineWidth = 4
  for (const [cx, cy, dx, dy] of [
    [bx, by, 1, 1],
    [bx + bw, by, -1, 1],
    [bx, by + bh, 1, -1],
    [bx + bw, by + bh, -1, -1],
  ]) {
    actx.beginPath()
    actx.moveTo(cx + dx * arm, cy)
    actx.lineTo(cx, cy)
    actx.lineTo(cx, cy + dy * arm)
    actx.stroke()
  }

  // Bay markings text
  actx.fillStyle = 'rgba(205, 222, 245, 0.36)'
  actx.font = '600 18px "Inter", "SF Pro Display", sans-serif'
  actx.textAlign = 'center'
  actx.fillText('BAY 01  //  WRAP & DETAILING PIT', size / 2, by + bh + 48)
  actx.fillText('ENTRY  ▲', size / 2, by - 36)

  const albedoTex = new THREE.CanvasTexture(albedoCanvas)
  albedoTex.colorSpace = THREE.SRGBColorSpace
  albedoTex.anisotropy = renderer.capabilities.getMaxAnisotropy()

  const roughCanvas = document.createElement('canvas')
  roughCanvas.width = roughCanvas.height = 512
  const rctx = roughCanvas.getContext('2d')
  const rgrad = rctx.createRadialGradient(256, 256, 30, 256, 256, 280)
  rgrad.addColorStop(0, '#3a3a3a')
  rgrad.addColorStop(0.65, '#525252')
  rgrad.addColorStop(1, '#787878')
  rctx.fillStyle = rgrad
  rctx.fillRect(0, 0, 512, 512)
  for (let i = 0; i < 6000; i++) {
    const x = Math.random() * 512
    const y = Math.random() * 512
    const v = 48 + Math.floor(Math.random() * 34)
    rctx.fillStyle = `rgba(${v},${v},${v},0.18)`
    rctx.fillRect(x, y, 3, 3)

/**
 * Create a 100% Pure 3D Sculpted Curved Turbine Spoke (Zero 2D Image Stickers!)
 */
function createTurbineSpokeGeometry(R_rim, dishDepth) {
  const rInner = R_rim * 0.22
  const rOuter = R_rim * 0.965
  const shape = new THREE.Shape()
  // Swept directional turbine blade profile (wide outer lip tapering cleanly into center hub)
  shape.moveTo(rInner, -R_rim * 0.048)
  shape.quadraticCurveTo(R_rim * 0.56, -R_rim * 0.025, rOuter, -R_rim * 0.015)
  shape.lineTo(rOuter, R_rim * 0.135)
  shape.quadraticCurveTo(R_rim * 0.58, R_rim * 0.085, rInner, R_rim * 0.048)
  shape.closePath()

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.018,
    bevelEnabled: true,
    bevelThickness: 0.0055,
    bevelSize: 0.0045,
    bevelSegments: 2,
    curveSegments: 10,
  })
  // Curve the spoke smoothly inward toward center hub (genuine 3D concave dish!)
  const pos = geo.attributes.position
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i)
    const y = pos.getY(i)
    const z = pos.getZ(i)
    const r = Math.hypot(x, y)
    const t = Math.min(1, Math.max(0, (r - rInner) / (rOuter - rInner)))
    const zOffset = -dishDepth * Math.pow(1 - t, 1.45)
    pos.setZ(i, z + zOffset)
  }
  geo.computeVertexNormals()
  return geo
}

/**
 * Create a 100% Pure 3D Sculpted Brembo-Style Monoblock Brake Caliper (Zero Stickers!)
 * Curved C-arc housing clamping the rotor edge with 3D piston bosses, bridge ribs & white racing bar.
 */
function create3DBremboCaliper(R_rim, W, isLeftSide, caliperMat) {
  const group = new THREE.Group()
  const rIn = R_rim * 0.51
  const rOut = R_rim * 0.785
  const arcHalf = 0.56 // ~64 deg curved monoblock body

  const shape = new THREE.Shape()
  shape.absarc(0, 0, rOut, -arcHalf, arcHalf, false)
  shape.absarc(0, 0, rIn, arcHalf, -arcHalf, true)
  shape.closePath()

  const bodyGeo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.072,
    bevelEnabled: true,
    bevelThickness: 0.008,
    bevelSize: 0.007,
    bevelSegments: 3,
    curveSegments: 24,
  })
  bodyGeo.translate(0, 0, -0.036)
  const bodyMesh = new THREE.Mesh(bodyGeo, caliperMat)
  bodyMesh.castShadow = true
  group.add(bodyMesh)

  // 3D Outer Piston Bridge & Center Slot Detail
  const darkMetal = new THREE.MeshStandardMaterial({ color: '#1b1f26', metalness: 0.85, roughness: 0.3 })
  const padBack = new THREE.Mesh(new THREE.BoxGeometry(R_rim * 0.14, R_rim * 0.36, 0.042), darkMetal)
  padBack.position.set(R_rim * 0.62, 0, -0.005)
  group.add(padBack)

  // Two sculpted 3D outer piston bosses + subtle recessed white metallic emblem bar on outer face
  const pistonGeo = new THREE.CylinderGeometry(R_rim * 0.055, R_rim * 0.06, 0.012, 16)
  pistonGeo.rotateX(Math.PI / 2)
  for (const ang of [-0.26, 0.26]) {
    const p = new THREE.Mesh(pistonGeo, caliperMat)
    p.position.set(Math.cos(ang) * R_rim * 0.65, Math.sin(ang) * R_rim * 0.65, 0.04)
    group.add(p)
  }

  // Crisp 3D raised silver/white performance logo bar on caliper face
  const badge = new THREE.Mesh(
    new THREE.BoxGeometry(R_rim * 0.028, R_rim * 0.22, 0.004),
    new THREE.MeshStandardMaterial({ color: '#eef2f7', metalness: 0.3, roughness: 0.25 })
  )
  badge.position.set(R_rim * 0.66, 0, 0.046)
  group.add(badge)

  // Position caliper behind the spokes, clamping the rotor on the trailing side
  group.position.z = W * 0.11
  group.rotation.z = isLeftSide ? Math.PI - 0.18 : 0.18
  return group
}

    clearcoat: 0.45,
    clearcoatRoughness: 0.16,
    envMapIntensity: 1.35,
    side: THREE.DoubleSide,
  })
  if (!isSpare) rimMaterials.push(rimMat)

  // 2. Forged 20" Outer Rim Lip & Deep Inner Barrel
  const barrelProfile = [
    new THREE.Vector2(R_rim * 0.96, -W * 0.42),
    new THREE.Vector2(R_rim * 0.90, -W * 0.36),
    new THREE.Vector2(R_rim * 0.90, W * 0.36),
    new THREE.Vector2(R_rim * 0.975, W * 0.445),
    new THREE.Vector2(R_rim * 1.015, W * 0.458),
    new THREE.Vector2(R_rim * 1.02, W * 0.425),
    new THREE.Vector2(R_rim * 0.96, W * 0.415),
  ]
  const barrelGeo = new THREE.LatheGeometry(barrelProfile, 52)
  barrelGeo.rotateX(Math.PI / 2)
  const barrelMesh = new THREE.Mesh(barrelGeo, rimMat)
  barrelMesh.castShadow = true
  wheel.add(barrelMesh)

  // 3. 10 Sculpted 3D Directional Turbine Spokes (Concave Dish!)
  const dishDepth = W * 0.16
  const spokeGeo = createTurbineSpokeGeometry(R_rim, dishDepth)
  const spokesGroup = new THREE.Group()
  spokesGroup.position.z = W * 0.425
  for (let i = 0; i < 10; i++) {
    const spoke = new THREE.Mesh(spokeGeo, rimMat)
    spoke.rotation.z = (i / 10) * Math.PI * 2
    spoke.castShadow = true
    spoke.receiveShadow = true
    spokesGroup.add(spoke)
  }
  if (!isLeftSide) spokesGroup.scale.x = -1
  wheel.add(spokesGroup)

  // 4. Sculpted 3D Center Hub Bowl + Center Cap + 5 Recessed Lug Nuts
  const hubZ = W * 0.425 - dishDepth
  const hubBowl = new THREE.Mesh(
    new THREE.CylinderGeometry(R_rim * 0.255, R_rim * 0.275, 0.036, 32),
    rimMat
  )
  hubBowl.rotation.x = Math.PI / 2
  hubBowl.position.z = hubZ - 0.004
  wheel.add(hubBowl)

  const capMesh = new THREE.Mesh(
    new THREE.CylinderGeometry(R_rim * 0.115, R_rim * 0.115, 0.014, 24),
    new THREE.MeshStandardMaterial({ color: '#14171d', metalness: 0.8, roughness: 0.26 })
  )
  capMesh.rotation.x = Math.PI / 2
  capMesh.position.z = hubZ + 0.014
  wheel.add(capMesh)

  const capRing = new THREE.Mesh(
    new THREE.RingGeometry(R_rim * 0.105, R_rim * 0.118, 32),
    new THREE.MeshStandardMaterial({ color: '#9ca6b5', metalness: 0.92, roughness: 0.2, side: THREE.DoubleSide })
  )
  capRing.position.z = hubZ + 0.022
  wheel.add(capRing)

  const lugMat = new THREE.MeshStandardMaterial({ color: '#383e48', metalness: 0.92, roughness: 0.22 })
  const lugGeo = new THREE.CylinderGeometry(R_rim * 0.025, R_rim * 0.025, 0.022, 6)
  lugGeo.rotateX(Math.PI / 2)
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2 + Math.PI / 2
    const lug = new THREE.Mesh(lugGeo, lugMat)
    lug.position.set(Math.cos(a) * R_rim * 0.195, Math.sin(a) * R_rim * 0.195, hubZ + 0.012)
    wheel.add(lug)
  }

  // 5. 3D Brushed-Steel Slotted Brake Rotor + 3D Brembo Monoblock Caliper (Only on mounted wheels)
  if (!isSpare) {
    const backPlate = new THREE.Mesh(
      new THREE.CircleGeometry(R_rim * 0.88, 32),
      new THREE.MeshStandardMaterial({ color: '#090b0f', roughness: 0.9, metalness: 0.2, side: THREE.DoubleSide })
    )
    backPlate.position.z = -W * 0.14
    wheel.add(backPlate)

    const rotorMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(R_rim * 0.76, R_rim * 0.76, 0.024, 40),
      new THREE.MeshStandardMaterial({
        map: rotorTex,
        color: '#d4dce6',
        metalness: 0.92,
        roughness: 0.30,
        envMapIntensity: 1.25,
      })
    )
    rotorMesh.rotation.x = Math.PI / 2
    rotorMesh.position.z = W * 0.10
    wheel.add(rotorMesh)

    const caliperMat = new THREE.MeshPhysicalMaterial({
      color: params.caliperColor,
      metalness: 0.32,
      roughness: 0.22,
      clearcoat: 1.0,
      clearcoatRoughness: 0.06,
      envMapIntensity: 1.35,
    })
    caliperMaterials.push(caliperMat)
    wheel.add(create3DBremboCaliper(R_rim, W, isLeftSide, caliperMat))
  }

  if (outward) {
    wheel.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), outward.clone().normalize())
  }
  wheel.traverse((obj) => {
    obj.userData.proceduralWheel = true
  })
  return wheel
}

function attachWheels(root) {
  root.updateMatrixWorld(true)
  currentWheelAnchors.clear()
  const anchors = new Map()
  root.traverse((child) => {
    if (!WHEEL_ANCHOR.test(child.name || '')) return
    child.updateWorldMatrix(true, false)
    const world = new THREE.Vector3().setFromMatrixPosition(child.matrixWorld)
    anchors.set(child.name, root.worldToLocal(world.clone()))
    currentWheelAnchors.set(child.name, world.clone())
  })
  if (anchors.size === 0) return

  const pair = [
    ['Wheel_LF_Spatial', 'Wheel_RF_Spatial'],
    ['Wheel_LR_Spatial', 'Wheel_RR_Spatial'],
    ['Wheel_RL_Spatial', 'Wheel_RR_Spatial'],
  ]
    .map(([left, right]) => [anchors.get(left), anchors.get(right)])
    .find(([left, right]) => left && right)

  const axle = pair
    ? new THREE.Vector3().subVectors(pair[1], pair[0]).normalize()
    : new THREE.Vector3(1, 0, 0)

  currentCarForwardAxis = Math.abs(axle.x) > Math.abs(axle.z) ? 'z' : 'x'

  const centre = new THREE.Vector3()
  for (const local of anchors.values()) centre.add(local)
  centre.divideScalar(anchors.size)

  for (const [name, local] of anchors) {
    const isLeft = /_L[FR]_/.test(name) || /_RL_/.test(name)
    const outward = local.clone().sub(centre).dot(axle) >= 0 ? axle.clone() : axle.clone().negate()
    const wheel = makeWheel20(Math.abs(local.y), outward, isLeft, false)
    wheel.name = `preview-${name}`
    wheel.position.copy(local)
    root.add(wheel)
  }
}

function addContactShadow(root) {
  const prev = scene.getObjectByName('contact-shadow-group')
  if (prev) {
    scene.remove(prev)
    prev.traverse((o) => {
      if (o.geometry) o.geometry.dispose()
      if (o.material) {
        o.material.map?.dispose()
        o.material.dispose()
      }
    })
  }

  const box = new THREE.Box3()
  root.traverse((child) => {
    if (child.isMesh && child.visible && !child.userData.proceduralWheel) box.expandByObject(child)
  })
  if (box.isEmpty()) return

  const group = new THREE.Group()
  group.name = 'contact-shadow-group'

  const size = box.getSize(new THREE.Vector3())
  const centre = box.getCenter(new THREE.Vector3())

  const canvas = document.createElement('canvas')
  canvas.width = canvas.height = 256
  const ctx = canvas.getContext('2d')
  const grad = ctx.createRadialGradient(128, 128, 18, 128, 128, 122)
  grad.addColorStop(0, 'rgba(0,0,0,0.82)')
  grad.addColorStop(0.55, 'rgba(0,0,0,0.42)')
  grad.addColorStop(1, 'rgba(0,0,0,0)')
  ctx.fillStyle = grad
  ctx.fillRect(0, 0, 256, 256)

  const bodyShadow = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.max(size.x, size.z) * 1.12, Math.min(size.x, size.z) * 1.32),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false })
  )
  bodyShadow.rotation.x = -Math.PI / 2
  if (size.x < size.z) bodyShadow.rotation.z = Math.PI / 2
  bodyShadow.position.set(centre.x, 0.009, centre.z)
  group.add(bodyShadow)

  const wheelCanvas = document.createElement('canvas')
  wheelCanvas.width = wheelCanvas.height = 128
  const wctx = wheelCanvas.getContext('2d')
  const wgrad = wctx.createRadialGradient(64, 64, 6, 64, 64, 60)
  wgrad.addColorStop(0, 'rgba(0,0,0,0.88)')
  wgrad.addColorStop(0.5, 'rgba(0,0,0,0.38)')
  wgrad.addColorStop(1, 'rgba(0,0,0,0)')
  wctx.fillStyle = wgrad
  wctx.fillRect(0, 0, 128, 128)
  const wheelShadowTex = new THREE.CanvasTexture(wheelCanvas)

  for (const worldPos of currentWheelAnchors.values()) {
    const ws = new THREE.Mesh(
      new THREE.PlaneGeometry(0.75, 0.75),
      new THREE.MeshBasicMaterial({ map: wheelShadowTex, transparent: true, depthWrite: false })
    )
    ws.rotation.x = -Math.PI / 2
    ws.position.set(worldPos.x, 0.011, worldPos.z)
    group.add(ws)
  }

  scene.add(group)
}

/**
 * Unified Dark Smoked Automotive Privacy Glass (fixes white/grey rear window fade!)
 */
function clearGlass(root) {
  root.traverse((child) => {
    if (!child.isMesh) return
    const mats = [].concat(child.material)
    const next = mats.map((mat) => {
      const name = mat?.name || ''
      if (/seat|interior/i.test(name) && !/glass/i.test(name)) {
        mat.color = new THREE.Color('#1a1d24')
        if ('roughness' in mat) mat.roughness = 0.85
        if ('metalness' in mat) mat.metalness = 0.04
        return mat
      }
      if (!/glass/i.test(name) || /light/i.test(name)) return mat
      return new THREE.MeshPhysicalMaterial({
        name,
        color: '#080c12',
        metalness: 0.06,
        roughness: 0.03,
        clearcoat: 1.0,
        clearcoatRoughness: 0.02,
        transparent: true,
        opacity: 0.78,
        envMapIntensity: 1.85,
        depthWrite: false,
        side: THREE.DoubleSide,
      })
    })
    child.material = Array.isArray(child.material) ? next : next[0]
  })
}

const BODY = /paint|^cover|exterior/i
const NOT_BODY = /glass|light|interior|seat|trim|fade|plastic|rubber/i
const isBody = (name = '') => BODY.test(name) && !NOT_BODY.test(name)

function hasMappedWrapUv(geometry, uv) {
  const cache = geometry.userData
  if (cache.wrapUvMapped !== undefined) return cache.wrapUvMapped
  let minU = Infinity, maxU = -Infinity, minV = Infinity, maxV = -Infinity
  const step = Math.max(1, Math.floor(uv.count / 400))
  for (let i = 0; i < uv.count; i += step) {
    const u = uv.getX(i)
    const v = uv.getY(i)
    if (u < minU) minU = u
    if (u > maxU) maxU = u
    if (v < minV) minV = v
    if (v > maxV) maxV = v
  }
  const area = Math.max(0, maxU - minU) * Math.max(0, maxV - minV)
  cache.wrapUvMapped = area > 0.001
  return cache.wrapUvMapped
}

function syncSlidersFromParams() {
  const keys = ['clearcoat', 'clearcoatRoughness', 'metalness', 'roughness', 'envIntensity', 'exposure']
  for (const k of keys) {
    const el = document.getElementById(k)
    const val = document.getElementById(k + 'Val')
    if (el) el.value = params[k]
    if (val) val.textContent = Number(params[k]).toFixed(2)
  }
}

function bindSlider(id, key, digits = 2) {
  const el = document.getElementById(id)
  const val = document.getElementById(id + 'Val')
  if (!el) return
  const sync = () => {
    params[key] = Number(el.value)
    if (val) val.textContent = params[key].toFixed(digits)
    applyPaint()
    if (key === 'exposure') renderer.toneMappingExposure = params.exposure
  }
  el.addEventListener('input', sync)
}

function applyPaint() {
  const color = new THREE.Color(params.paint)
  for (const mat of paintMaterials) {
    mat.color.copy(color)
    mat.clearcoat = params.clearcoat
    mat.clearcoatRoughness = params.clearcoatRoughness
    mat.metalness = params.metalness
    mat.roughness = params.roughness
    mat.envMapIntensity = params.envIntensity
    mat.transparent = false
    mat.opacity = 1
    mat.depthWrite = true
    mat.needsUpdate = true
  }
  for (const shader of paintShaders) {
    if (shader.uniforms.uTex) shader.uniforms.uTex.value = wrapTexture
  }
}

function makePaintMaterial() {
  const mat = new THREE.MeshPhysicalMaterial({
    color: params.paint,
    roughness: params.roughness,
    metalness: params.metalness,
    clearcoat: params.clearcoat,
    clearcoatRoughness: params.clearcoatRoughness,
    envMapIntensity: params.envIntensity,
    transparent: false,
    opacity: 1,
  })
  mat.name = 'FactoryPaint'
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uTex = { value: wrapTexture }
    shader.vertexShader = 'varying vec2 vWrapUv;\nattribute vec2 wrapUv;\n' + shader.vertexShader
    shader.vertexShader = shader.vertexShader.replace(
      '#include <uv_vertex>',
      '#include <uv_vertex>\nvWrapUv = wrapUv;'
    )
    shader.fragmentShader = 'uniform sampler2D uTex;\nvarying vec2 vWrapUv;\n' + shader.fragmentShader
    shader.fragmentShader = shader.fragmentShader.replace(
      '#include <map_fragment>',
      `
      vec4 wrapColor = texture2D(uTex, vWrapUv);
      diffuseColor.rgb = mix(diffuseColor.rgb, wrapColor.rgb, wrapColor.a);
      `
    )
    paintShaders.push(shader)
  }
  mat.customProgramCacheKey = () => 'juniper-wrap-uv1'
  paintMaterials.push(mat)
  return mat
}

function atlasUrl(url) {
  if (url.startsWith('blob:') || url.startsWith('data:')) return url
  const map = {
    '/wraps/SharkMouth_3d.png': '/wraps/SharkMouth.png',
    '/wraps/UnicornNTD_3d.png': '/wraps/UnicornNTD_Tesla.png',
    '/wraps/UnicornNTD.png': '/wraps/UnicornNTD_Tesla.png',
  }
  return map[url] || url
}

function themePaint(url) {
  const optText = (wrapSelect.options[wrapSelect.selectedIndex]?.textContent || '').toLowerCase()
  const u = (url.startsWith('data:') ? optText : url.toLowerCase())
  if (u.includes('silverflow') || u.includes('银箭')) return '#0b0d10'
  if (u.includes('shark') || u.includes('鲨鱼')) return '#4a5c28'
  if (u.includes('unicorn')) return '#e7ebf1'
  if (u.includes('midnight')) return '#1c2744'
  if (u.includes('vintage')) return '#d26a32'
  return '#0b0d10'
}

async function loadWrap(url) {
  const src = atlasUrl(url)
  setStatus(`正在加载贴膜（官方 UV1）…`)
  const texture = await texLoader.loadAsync(src)
  texture.flipY = false
  texture.colorSpace = THREE.SRGBColorSpace
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy()
  texture.wrapS = texture.wrapT = THREE.ClampToEdgeWrapping
  texture.needsUpdate = true
  if (wrapTexture) wrapTexture.dispose()
  wrapTexture = texture
  params.paint = themePaint(url)
  applyPaint()
  setStatus(`贴膜已就绪 · 3D锻造20"轮毂 + 3D实体卡钳 + 科技P房工作间`)
}

function isGround(obj) {
  const names = [obj.name, obj.parent?.name, obj.material?.name]
    .concat([].concat(obj.material || []).map((m) => m?.name))
    .filter(Boolean)
    .join(' ')
    .toLowerCase()
  return /ground|floor|shadow/.test(names)
}

function dressModel(root) {
  let wrapped = 0
  root.traverse((child) => {
    if (isGround(child)) {
      child.visible = false
      return
    }
    if (!child.isMesh) return
    const mats = [].concat(child.material)
    const body = mats.some((m) => isBody(m?.name))
    const uv = child.geometry?.attributes?.uv1 || child.geometry?.attributes?.uv
    if (!body || !uv || !hasMappedWrapUv(child.geometry, uv)) {
      child.castShadow = true
      child.receiveShadow = true
      return
    }
    child.geometry.setAttribute('wrapUv', uv)
    child.material = makePaintMaterial()
    child.castShadow = true
    child.receiveShadow = true
    wrapped++
  })
  return wrapped
}

function disposeCar() {
  if (!carRoot) return
  scene.remove(carRoot)
  carRoot.traverse((obj) => {
    if (obj.geometry) obj.geometry.dispose()
  })
  carRoot = null
  paintMaterials.length = 0
  paintShaders.length = 0
  rimMaterials.length = 0
  caliperMaterials.length = 0
}

  const lf = currentWheelAnchors.get('Wheel_LF_Spatial') || new THREE.Vector3(-0.78, 0.35, -1.51)
  if (currentCarForwardAxis === 'z') {

      workshop: { pos: [-4.9, 2.35, -5.6], target: [0.4, 1.15, 1.8] },

  return {

    workshop: { pos: [5.2, 2.35, -4.8], target: [-0.4, 1.15, 1.5] },

}

function setCameraPreset(name, instant = false) {
  const presets = getCameraPresets()
  const p = presets[name] || presets.threeQuarter
  document.querySelectorAll('#camBtns .pill').forEach((b) => {
    b.classList.toggle('active', b.dataset.cam === name)
  })
  if (instant) {
    camAnim = null
    camera.position.set(...p.pos)
    controls.target.set(...p.target)
    controls.update()
  } else {
    camAnim = {
      startPos: camera.position.clone(),
      endPos: new THREE.Vector3(...p.pos),
      startTarget: controls.target.clone(),
      endTarget: new THREE.Vector3(...p.target),
      t: 0,
    }
  }
}
window.setCameraPreset = setCameraPreset

async function loadCar(car) {
  if (loadingCar) {
    pendingCar = car
    return
  }
  loadingCar = car.id
  currentCar = car
  titleEl.textContent = `${car.name} · P房工作间`
  subtitleEl.textContent = `${car.note} · 官方 UV1`
  fillWrapSelect(car)
  setStatus(`正在加载 ${car.name} 3D 模型…`)
  try {
    disposeCar()
    const draco = new DRACOLoader()
    draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/')
    const loader = new GLTFLoader()
    loader.setDRACOLoader(draco)
    // Body mesh is downloaded by scripts/fetch_assets.py and is not stored in git.
    const gltf = await loader.loadAsync('/model/juniper/Bayberry.gltf')
    if (currentCar.id !== car.id) return
    carRoot = gltf.scene
    const box = new THREE.Box3().setFromObject(carRoot)
    const center = new THREE.Vector3()
    box.getCenter(center)
    carRoot.position.x -= center.x
    carRoot.position.z -= center.z
    carRoot.position.y -= box.min.y
    const wrapped = dressModel(carRoot)
    clearGlass(carRoot)
    attachWheels(carRoot)
    scene.add(carRoot)
    addContactShadow(carRoot)
    setCameraPreset('threeQuarter', true)
    setStatus(`${car.name} 已入位（${wrapped} 块车身曲面），正在贴膜…`)
    await loadWrap(wrapSelect.value)
  } catch (err) {
    console.error(err)
    setStatus(`加载失败：${err.message || err}`)
  } finally {
    loadingCar = null
    if (pendingCar) {
      const next = pendingCar
      pendingCar = null
      loadCar(next)
    }
  }
}

function handleUploadedFile(file) {
  if (!file) return
  const url = URL.createObjectURL(file)
  const opt = document.createElement('option')

  wrapSelect.appendChild(opt)
  wrapSelect.value = url
  loadWrap(url)
}

function animate() {
  requestAnimationFrame(animate)
  if (camAnim) {
    camAnim.t = Math.min(1, camAnim.t + 0.065)
    const ease = 1 - Math.pow(1 - camAnim.t, 3)
    camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease)
    controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease)
    if (camAnim.t >= 1) camAnim = null
  }
  if (wrapTexture) {
    for (const shader of paintShaders) {
      if (shader.uniforms?.uTex) shader.uniforms.uTex.value = wrapTexture
    }
  }
  controls.update()
  renderer.render(scene, camera)
}
